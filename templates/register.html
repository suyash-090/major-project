{% extends "base.html" %}
{% block title %}Register, BreachBox{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="POST">
    <label>Display name<br><input type="text" name="display_name" required></label><br>
    <label>Class group<br><input type="text" name="class_group" placeholder="e.g. 12IT4" required></label><br>
    <label>Password<br><input type="password" name="password" required></label><br>
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
