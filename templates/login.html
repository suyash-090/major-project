{% extends "base.html" %}
{% block title %}Log in, BreachBox{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="POST">
    <label>Display name<br><input type="text" name="display_name" required></label><br>
    <label>Password<br><input type="password" name="password" required></label><br>
    <button type="submit">Log in</button>
</form>
<p>Need an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
{% endblock %}
