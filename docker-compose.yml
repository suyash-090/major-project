# This is the two-zone isolation model from the architecture diagram in
# the proposal. breachbox_app (accounts, scoring, dashboard, hints) sits
# in protected_zone. target_app (the deliberately vulnerable staff portal)
# sits in vulnerable_zone. They do NOT share a network, and they do NOT
# share a database, that separation is the entire point.
#
# The only legitimate crossing point between zones is a human: a student
# exploits target_app, gets a flag string, then manually submits that
# string to breachbox_app's /api/submit. There is no direct network path
# from one container to the other, which is exactly what Week 8's
# isolation penetration test needs to confirm.

services:
  breachbox_app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app  # live-reloads code changes during development
    environment:
      - SECRET_KEY=dev-only-change-me
      - DATABASE_URL=sqlite:///breachbox.db
      # Shared with target_app so both derive the same per-student flags. This
      # is a config value, NOT a network path between the zones. Change it for
      # a real deployment (and keep both services identical).
      - FLAG_SECRET=breachbox-dev-flag-secret-change-me
      # The seeded teacher/admin account's password. Change it for a real deployment.
      - ADMIN_PASSWORD=breachbox-teacher
    networks:
      - protected_zone

  target_app:
    build: ./target_app
    environment:
      # Must match breachbox_app's FLAG_SECRET so the two agree on flags.
      - FLAG_SECRET=breachbox-dev-flag-secret-change-me
    ports:
      - "5001:5001"  # exposed to the host for convenience during
                      # development only, this port mapping does not
                      # create a path to breachbox_app, only to your
                      # own browser. Consider removing it before the
                      # real Week 8 test, so the only way in is
                      # genuinely as an attacker would find it.
    volumes:
      - ./target_app:/app
    networks:
      - vulnerable_zone
    # deliberately NOT also listed under protected_zone, that omission
    # is what isolation actually means here, not just a label

networks:
  protected_zone:
    driver: bridge
  vulnerable_zone:
    driver: bridge
