{% extends "base.html" %}
{% block title %}Ticket #{{ ticket.id }}{% endblock %}
{% block content %}
<h1>Ticket #{{ ticket.id }}</h1>
<p><strong>From:</strong> {{ ticket.requester_name }}</p>
<p><strong>Subject:</strong> {{ ticket.subject }}</p>
<div id="feedback-display">{{ ticket.body }}</div>
<p><a href="/tickets/new">Submit another ticket</a></p>
{% endblock %}
