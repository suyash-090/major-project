{% extends "base.html" %}
{% block title %}Staff Feedback Board{% endblock %}
{% block content %}
<h1>Staff Feedback Board</h1>

{% if flag %}
<p class="flag-banner"><strong>Flag:</strong> {{ flag }} (submit this flag at breachbox_app's /api/submit)</p>
{% endif %}

<form method="GET" action="/feedback">
    <label>Leave feedback<input type="text" name="message" size="60"></label>
    <button type="submit">Submit</button>
</form>

<h2>Latest feedback</h2>
<div id="feedback-display">
    {{ message|safe }}
</div>
{% endblock %}
